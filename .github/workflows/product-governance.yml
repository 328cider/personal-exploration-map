name: product-governance

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    paths:
      - "PRODUCT_CONSTITUTION.md"
      - "AGENTS.md"
      - "CURRENT_DIRECTION.md"
      - "docs/**"
      - "packages/mapping-core/**"
      - "packages/mapping-engine/**"
      - "packages/experience-sdk/**"
      - "apps/game-*/**"
      - "package.json"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
      - ".github/workflows/**"
      - "scripts/check-product-governance.mjs"
      - "scripts/check-architecture-boundaries.mjs"
      - "scripts/check-ci-budget-policy.mjs"
  push:
    branches: [main]
    paths:
      - "PRODUCT_CONSTITUTION.md"
      - "AGENTS.md"
      - "CURRENT_DIRECTION.md"
      - "docs/**"
      - "packages/mapping-core/**"
      - "packages/mapping-engine/**"
      - "packages/experience-sdk/**"
      - "apps/game-*/**"
      - "package.json"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
      - ".github/workflows/**"
      - "scripts/check-product-governance.mjs"
      - "scripts/check-architecture-boundaries.mjs"
      - "scripts/check-ci-budget-policy.mjs"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guardrails:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect pull-request changed files
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD > /tmp/governance-changed-files.txt
          {
            echo 'GOVERNANCE_CHANGED_FILES<<EOF'
            cat /tmp/governance-changed-files.txt
            echo 'EOF'
          } >> "$GITHUB_ENV"

      - name: Check product governance
        run: node scripts/check-product-governance.mjs

      - name: Check architecture boundaries
        run: node scripts/check-architecture-boundaries.mjs

      - name: Check GitHub Actions budget policy
        run: node scripts/check-ci-budget-policy.mjs
