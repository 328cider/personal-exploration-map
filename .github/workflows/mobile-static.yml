name: mobile-static

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    paths:
      - "apps/mobile/**"
      - "packages/mapping-core/**"
      - "packages/mapping-engine/**"
      - "packages/sqlite-adapter/**"
      - "scripts/check-architecture-boundaries.mjs"
      - "scripts/check-mobile-write-boundary.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/mobile-static.yml"
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/mapping-core/**"
      - "packages/mapping-engine/**"
      - "packages/sqlite-adapter/**"
      - "scripts/check-architecture-boundaries.mjs"
      - "scripts/check-mobile-write-boundary.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/mobile-static.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Check architecture boundaries
        run: node scripts/check-architecture-boundaries.mjs
      - name: Check mobile canonical write boundary
        run: node scripts/check-mobile-write-boundary.mjs
      - name: Generate the SDK 57 dependency lock for review
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Upload the generated dependency lock
        uses: actions/upload-artifact@v4
        with:
          name: issue128-sdk57-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
      - name: Install generated dependency graph
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check Expo dependency compatibility
        working-directory: apps/mobile
        run: npx expo install --check
      - name: Run Expo Doctor
        working-directory: apps/mobile
        run: npx --yes expo-doctor
      - name: Type-check the mobile application
        run: npm run typecheck:mobile
