name: mobile-static

on:
  pull_request:
    paths:
      - "apps/mobile/**"
      - "packages/mapping-core/**"
      - "packages/mapping-engine/**"
      - "packages/sqlite-adapter/**"
      - "scripts/check-architecture-boundaries.mjs"
      - "scripts/check-mobile-write-boundary.mjs"
      - "scripts/check-renderer-boundary.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/mobile-static.yml"
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/mapping-core/**"
      - "packages/mapping-engine/**"
      - "packages/sqlite-adapter/**"
      - "scripts/check-architecture-boundaries.mjs"
      - "scripts/check-mobile-write-boundary.mjs"
      - "scripts/check-renderer-boundary.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/mobile-static.yml"

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check architecture boundaries
        run: node scripts/check-architecture-boundaries.mjs
      - name: Check mobile canonical write boundary
        run: node scripts/check-mobile-write-boundary.mjs
      - name: Check renderer dependency and read-only boundary
        run: node scripts/check-renderer-boundary.mjs
      - name: Install locked workspace dependencies without native build scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Type-check the mobile application
        run: npm run typecheck:mobile
      - name: Test read-only renderer geometry
        run: npm run test:renderer --workspace @exploration-map/mobile
      - name: Benchmark renderer geometry construction
        run: npm run benchmark:renderer --workspace @exploration-map/mobile
