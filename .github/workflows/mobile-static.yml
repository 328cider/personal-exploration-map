name: mobile-static

on:
  pull_request:
    paths:
      - "apps/mobile/**"
      - "packages/mapping-core/**"
      - "packages/mapping-engine/**"
      - "packages/sqlite-adapter/**"
      - "scripts/check-architecture-boundaries.mjs"
      - "scripts/check-mobile-write-boundary.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/mobile-static.yml"
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/mapping-core/**"
      - "packages/mapping-engine/**"
      - "packages/sqlite-adapter/**"
      - "scripts/check-architecture-boundaries.mjs"
      - "scripts/check-mobile-write-boundary.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/mobile-static.yml"

permissions:
  contents: write

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check architecture boundaries
        run: node scripts/check-architecture-boundaries.mjs
      - name: Check mobile canonical write boundary
        run: node scripts/check-mobile-write-boundary.mjs
      - name: Generate dependency lock without native build scripts
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check Expo dependency compatibility
        working-directory: apps/mobile
        run: npx expo install --check
      - name: Run Expo Doctor
        working-directory: apps/mobile
        run: npx expo-doctor
      - name: Type-check the mobile application
        run: npm run typecheck:mobile
      - name: Commit generated lockfile to the PR branch
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json is already current"
            exit 0
          fi
          git commit -m "chore: lock Expo dependencies"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
