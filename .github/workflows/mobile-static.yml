name: mobile-static

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    paths:
      - "apps/mobile/**"
      - "packages/mapping-core/**"
      - "packages/mapping-engine/**"
      - "packages/sqlite-adapter/**"
      - "scripts/check-architecture-boundaries.mjs"
      - "scripts/check-mobile-write-boundary.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/mobile-static.yml"
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/mapping-core/**"
      - "packages/mapping-engine/**"
      - "packages/sqlite-adapter/**"
      - "scripts/check-architecture-boundaries.mjs"
      - "scripts/check-mobile-write-boundary.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/mobile-static.yml"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Check architecture boundaries
        run: node scripts/check-architecture-boundaries.mjs
      - name: Check mobile canonical write boundary
        run: node scripts/check-mobile-write-boundary.mjs
      - name: Generate and commit the SDK 57 dependency lock
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          if git diff --quiet -- package-lock.json; then
            echo "The committed lockfile is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(expo): refresh SDK 57 dependency lock"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
      - name: Install committed dependency graph
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check Expo dependency compatibility
        working-directory: apps/mobile
        run: npx expo install --check
      - name: Run Expo Doctor
        working-directory: apps/mobile
        run: npx --yes expo-doctor
      - name: Type-check the mobile application
        run: npm run typecheck:mobile
