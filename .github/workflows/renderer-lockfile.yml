name: renderer-lockfile

on:
  pull_request:
    paths:
      - "apps/mobile/package.json"
      - ".github/workflows/renderer-lockfile.yml"
  push:
    branches: [agent/svg-renderer]
    paths:
      - "apps/mobile/package.json"
      - ".github/workflows/renderer-lockfile.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Resolve the Expo-compatible SVG dependency
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify the generated lockfile with npm ci
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify the resolved renderer version
        run: npm ls react-native-svg --workspace @exploration-map/mobile --depth=0
      - name: Commit the generated lockfile to the source branch
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json is already current"
          else
            git commit -m "chore(renderer): lock react-native-svg"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: renderer-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
