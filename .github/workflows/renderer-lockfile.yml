name: renderer-lockfile

on:
  pull_request:
    paths:
      - "apps/mobile/package.json"
      - ".github/workflows/renderer-lockfile.yml"

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Resolve the Expo-compatible SVG dependency
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify the generated lockfile with npm ci
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify the resolved renderer version
        run: npm ls react-native-svg --workspace @exploration-map/mobile --depth=0
      - name: Write the generated lockfile to the pull-request branch
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.head_ref }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import json
          import os

          with open("package-lock.json", "rb") as source:
              content = base64.b64encode(source.read()).decode("ascii")
          payload = {
              "message": "chore(renderer): lock react-native-svg",
              "content": content,
              "branch": os.environ["HEAD_BRANCH"],
          }
          with open("/tmp/package-lock-request.json", "w", encoding="utf-8") as target:
              json.dump(payload, target)
          PY
          gh api \
            --method PUT \
            "repos/${REPOSITORY}/contents/package-lock.json" \
            --input /tmp/package-lock-request.json
      - uses: actions/upload-artifact@v4
        with:
          name: renderer-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
