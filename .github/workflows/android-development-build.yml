name: android-development-build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/mobile/app.json"
      - "apps/mobile/package.json"
      - "apps/mobile/src/components/TrackCanvas.tsx"
      - "apps/mobile/src/rendering/**"
      - "package-lock.json"
      - ".github/workflows/android-development-build.yml"

concurrency:
  group: android-development-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install locked workspace dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate the Android native project
        working-directory: apps/mobile
        env:
          CI: "1"
        run: npx expo prebuild --platform android --clean
      - name: Assemble the development debug APK
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Upload development APK
        uses: actions/upload-artifact@v4
        with:
          name: personal-exploration-map-android-debug
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
