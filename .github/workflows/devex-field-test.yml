name: devex-field-test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/devex-field-test.yml"
      - ".dockerignore"
      - "compose.yaml"
      - "docker/**"
      - "scripts/docker-metro.ps1"
      - "scripts/prepare-field-test-sources.mjs"
      - "scripts/enable-field-test-debuggable.mjs"
      - "scripts/pull-field-test-bundle.ps1"
      - "scripts/check-tracking-stop-policy.mjs"
      - "scripts/android-emulator-smoke.py"
      - "scripts/android-emulator-smoke-runner.py"
      - "scripts/android-emulator-system-dialog-runner.py"
      - "scripts/android-emulator-background-growth-runner.py"
      - "scripts/android-emulator-coverage-modes.py"
      - "scripts/android-emulator-interaction-smoke.py"
      - "scripts/android-emulator-interaction-runner.py"
      - "scripts/android-emulator-interaction-compat-runner.py"
      - "scripts/run-android-emulator-e2e.sh"
      - "apps/mobile/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"

permissions:
  contents: read

concurrency:
  group: devex-field-test-v12-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "1"
  EXPO_NO_TELEMETRY: "1"

jobs:
  docker-check:
    name: Docker mobile check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Parse the Windows USB collection script
        shell: pwsh
        run: |
          $source = [System.IO.File]::ReadAllText("scripts/pull-field-test-bundle.ps1")
          [void][ScriptBlock]::Create($source)
      - name: Build pinned development image
        run: docker compose build
      - name: Run committed dependency graph and mobile checks
        run: docker compose run --rm check

  field-test-apk:
    name: Standalone USB-debuggable field-test APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_VARIANT: field-test
      EXPO_PUBLIC_FIELD_TEST: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install committed dependency graph
        run: npm ci --no-audit --no-fund
      - name: Validate mapping and mobile application
        run: npm run mobile:check
      - name: Enable coordinate-free field diagnostics
        run: node scripts/prepare-field-test-sources.mjs
      - name: Type-check prepared field-test sources
        run: npm run typecheck:mobile
      - name: Generate isolated Android native project
        run: npm run mobile:prebuild:android
      - name: Enable USB extraction only for the Field-test release
        run: node scripts/enable-field-test-debuggable.mjs
      - name: Assemble Metro-independent release variant
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Verify bundled, signed, and debuggable APK
        run: |
          set -euo pipefail
          source_apk="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          output_dir="artifacts/field-test"
          output_apk="$output_dir/personal-exploration-map-field-test.apk"

          test -f "$source_apk"
          mkdir -p "$output_dir"
          cp "$source_apk" "$output_apk"

          unzip -l "$output_apk" | grep -q "assets/index.android.bundle"

          apksigner_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          aapt_path="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$apksigner_path"
          test -n "$aapt_path"
          "$apksigner_path" verify --verbose --print-certs "$output_apk"
          "$aapt_path" dump badging "$output_apk" | tee "$output_dir/apk-badging.txt"
          grep -q "application-debuggable" "$output_dir/apk-badging.txt"

          sha256sum "$output_apk" > "$output_dir/SHA256SUMS.txt"
          cat "$output_dir/SHA256SUMS.txt"
      - name: Upload field-test APK
        uses: actions/upload-artifact@v4
        with:
          name: personal-exploration-map-field-test
          path: artifacts/field-test/
          if-no-files-found: error
          retention-days: 14

  emulator-e2e:
    name: Android emulator user-flow and USB extraction gate
    needs: field-test-apk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APK_PATH: artifacts/field-test/personal-exploration-map-field-test.apk
      EVIDENCE_DIR: artifacts/emulator-e2e
      FIELD_TEST_PACKAGE: com.cider328.personalexplorationmap.fieldtest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Download the exact field-test APK produced by this run
        uses: actions/download-artifact@v4
        with:
          name: personal-exploration-map-field-test
          path: artifacts/field-test
      - name: Prepare evidence directory
        run: |
          mkdir -p "$EVIDENCE_DIR"
          cat > "$EVIDENCE_DIR/harness.json" <<'JSON'
          {
            "provider": "ReactiveCircus/android-emulator-runner",
            "version": "2.37.0",
            "apiLevel": 35,
            "target": "google_apis",
            "arch": "x86_64"
          }
          JSON
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run black-box lifecycle and the real USB collection script on Android 15
        uses: ReactiveCircus/android-emulator-runner@v2.37.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel
          cores: 2
          ram-size: 4096M
          emulator-boot-timeout: 600
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -no-snapshot -noaudio
            -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            set -eu
            bash scripts/run-android-emulator-e2e.sh "$APK_PATH" "$EVIDENCE_DIR"

            pwsh -NoProfile -File scripts/pull-field-test-bundle.ps1 -OutputRoot "$EVIDENCE_DIR/device-bundles" -PackageName "$FIELD_TEST_PACKAGE"

            bundle_dir="$(find "$EVIDENCE_DIR/device-bundles" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
            test -n "$bundle_dir"
            test -s "$bundle_dir/app/app-private-data.tar"
            test -s "$bundle_dir/coordinate-free-diagnostics.txt"
            test -s "$bundle_dir/manifest.json"
            test -s "$bundle_dir/SHA256SUMS.txt"
            test -f "$bundle_dir.zip"

            grep -q "device_model=" "$bundle_dir/coordinate-free-diagnostics.txt"
            grep -q "session_started_at_iso_utc=" "$bundle_dir/coordinate-free-diagnostics.txt"
            grep -q "start_battery_percent=" "$bundle_dir/coordinate-free-diagnostics.txt"
            if grep -Eiq "latitude|longitude" "$bundle_dir/coordinate-free-diagnostics.txt"; then
              echo "Coordinate-free summary unexpectedly contains coordinate field names." >&2
              exit 1
            fi

            mkdir -p "$EVIDENCE_DIR/extracted-app-data"
            tar -xf "$bundle_dir/app/app-private-data.tar" -C "$EVIDENCE_DIR/extracted-app-data"

            python3 - <<'PY'
            import json
            import pathlib
            import sqlite3

            evidence = pathlib.Path("artifacts/emulator-e2e")
            root = evidence / "extracted-app-data"
            database = next(root.rglob("personal-exploration-map.db"))
            connection = sqlite3.connect(database)
            rows = connection.execute(
                "SELECT kind, payload_json FROM tracking_diagnostic_events "
                "WHERE kind IN ('environment.session.started','environment.session.ended') "
                "ORDER BY occurred_at"
            ).fetchall()
            connection.close()
            kinds = [row[0] for row in rows]
            assert "environment.session.started" in kinds, kinds
            assert "environment.session.ended" in kinds, kinds
            payloads = [json.loads(row[1]) for row in rows if row[1]]
            required = {
                "manufacturer",
                "model",
                "androidVersion",
                "batteryLevelPercent",
                "elapsedRealtimeMs",
                "backgroundLocationGranted",
                "notificationGranted",
                "isDebuggable",
            }
            assert payloads, "environment payloads are missing"
            assert required.issubset(payloads[0]), sorted(payloads[0])
            assert payloads[0]["isDebuggable"] is True, payloads[0]
            (evidence / "environment-events.json").write_text(
                json.dumps(payloads, indent=2, ensure_ascii=False) + "\n",
                encoding="utf-8",
            )
            PY
      - name: Upload emulator screenshots, UI hierarchy and USB evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: personal-exploration-map-emulator-e2e
          path: artifacts/emulator-e2e/
          if-no-files-found: warn
          retention-days: 14
