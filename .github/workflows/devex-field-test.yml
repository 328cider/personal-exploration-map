name: devex-field-test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/devex-field-test.yml"
      - ".dockerignore"
      - "compose.yaml"
      - "docker/**"
      - "scripts/docker-metro.ps1"
      - "scripts/prepare-field-test-sources.mjs"
      - "scripts/check-tracking-stop-policy.mjs"
      - "scripts/android-emulator-smoke.py"
      - "apps/mobile/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"

permissions:
  contents: read

concurrency:
  group: devex-field-test-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "1"
  EXPO_NO_TELEMETRY: "1"

jobs:
  docker-check:
    name: Docker mobile check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned development image
        run: docker compose build
      - name: Run committed dependency graph and mobile checks
        run: docker compose run --rm check

  field-test-apk:
    name: Standalone field-test APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_VARIANT: field-test
      EXPO_PUBLIC_FIELD_TEST: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install committed dependency graph
        run: npm ci --no-audit --no-fund
      - name: Validate mapping and mobile application
        run: npm run mobile:check
      - name: Enable coordinate-free field diagnostics
        run: node scripts/prepare-field-test-sources.mjs
      - name: Type-check prepared field-test sources
        run: npm run typecheck:mobile
      - name: Generate isolated Android native project
        run: npm run mobile:prebuild:android
      - name: Assemble Metro-independent release variant
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Verify bundled and signed APK
        run: |
          set -euo pipefail
          source_apk="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          output_dir="artifacts/field-test"
          output_apk="$output_dir/personal-exploration-map-field-test.apk"

          test -f "$source_apk"
          mkdir -p "$output_dir"
          cp "$source_apk" "$output_apk"

          unzip -l "$output_apk" | grep -q "assets/index.android.bundle"

          apksigner_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner_path"
          "$apksigner_path" verify --verbose --print-certs "$output_apk"

          sha256sum "$output_apk" > "$output_dir/SHA256SUMS.txt"
          cat "$output_dir/SHA256SUMS.txt"
      - name: Upload field-test APK
        uses: actions/upload-artifact@v4
        with:
          name: personal-exploration-map-field-test
          path: artifacts/field-test/
          if-no-files-found: error
          retention-days: 14

  emulator-e2e:
    name: Android emulator user-flow gate
    needs: field-test-apk
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      AVD_NAME: pem_api_35
      SYSTEM_IMAGE: system-images;android-35;google_apis;x86_64
      APK_PATH: artifacts/field-test/personal-exploration-map-field-test.apk
      EVIDENCE_DIR: artifacts/emulator-e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Download the exact field-test APK produced by this run
        uses: actions/download-artifact@v4
        with:
          name: personal-exploration-map-field-test
          path: artifacts/field-test
      - name: Enable emulator acceleration
        run: |
          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
          fi
          "$ANDROID_HOME/emulator/emulator" -accel-check || true
      - name: Install emulator image and create disposable AVD
        run: |
          sdkmanager --install \
            "platform-tools" \
            "emulator" \
            "$SYSTEM_IMAGE"
          echo "no" | avdmanager create avd \
            --force \
            --name "$AVD_NAME" \
            --package "$SYSTEM_IMAGE" \
            --device "pixel"
      - name: Start headless Android emulator
        run: |
          mkdir -p "$EVIDENCE_DIR"
          nohup "$ANDROID_HOME/emulator/emulator" \
            -avd "$AVD_NAME" \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -wipe-data \
            -gpu swiftshader_indirect \
            -camera-back none \
            -camera-front none \
            > "$EVIDENCE_DIR/emulator.log" 2>&1 &
          echo $! > "$EVIDENCE_DIR/emulator.pid"

          adb wait-for-device
          timeout 300 bash -c '
            until [[ "$(adb shell getprop sys.boot_completed | tr -d "\r")" == "1" ]]; do
              sleep 2
            done
          '
          adb shell input keyevent 82 || true
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell settings put secure long_press_timeout 300
          adb shell wm dismiss-keyguard || true
          adb devices -l
      - name: Run black-box PersonalMap lifecycle
        run: |
          python3 scripts/android-emulator-smoke.py \
            --apk "$APK_PATH" \
            --artifacts "$EVIDENCE_DIR"
      - name: Capture final emulator state
        if: always()
        run: |
          mkdir -p "$EVIDENCE_DIR"
          adb logcat -d -v threadtime > "$EVIDENCE_DIR/workflow-final-logcat.txt" 2>&1 || true
          adb shell dumpsys activity activities > "$EVIDENCE_DIR/workflow-final-activity.txt" 2>&1 || true
          adb shell dumpsys location > "$EVIDENCE_DIR/workflow-final-location.txt" 2>&1 || true
          adb exec-out screencap -p > "$EVIDENCE_DIR/workflow-final-screen.png" 2>/dev/null || true
      - name: Upload emulator screenshots, UI hierarchy and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: personal-exploration-map-emulator-e2e
          path: artifacts/emulator-e2e/
          if-no-files-found: error
          retention-days: 14
