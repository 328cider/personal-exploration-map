name: devex-field-test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/devex-field-test.yml"
      - ".dockerignore"
      - "compose.yaml"
      - "docker/**"
      - "scripts/docker-metro.ps1"
      - "scripts/prepare-field-test-sources.mjs"
      - "scripts/check-tracking-stop-policy.mjs"
      - "scripts/android-emulator-smoke.py"
      - "scripts/android-emulator-interaction-smoke.py"
      - "apps/mobile/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"

permissions:
  contents: read

concurrency:
  group: devex-field-test-v3-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "1"
  EXPO_NO_TELEMETRY: "1"

jobs:
  docker-check:
    name: Docker mobile check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned development image
        run: docker compose build
      - name: Run committed dependency graph and mobile checks
        run: docker compose run --rm check

  field-test-apk:
    name: Standalone field-test APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_VARIANT: field-test
      EXPO_PUBLIC_FIELD_TEST: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install committed dependency graph
        run: npm ci --no-audit --no-fund
      - name: Validate mapping and mobile application
        run: npm run mobile:check
      - name: Enable coordinate-free field diagnostics
        run: node scripts/prepare-field-test-sources.mjs
      - name: Type-check prepared field-test sources
        run: npm run typecheck:mobile
      - name: Generate isolated Android native project
        run: npm run mobile:prebuild:android
      - name: Assemble Metro-independent release variant
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Verify bundled and signed APK
        run: |
          set -euo pipefail
          source_apk="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          output_dir="artifacts/field-test"
          output_apk="$output_dir/personal-exploration-map-field-test.apk"

          test -f "$source_apk"
          mkdir -p "$output_dir"
          cp "$source_apk" "$output_apk"

          unzip -l "$output_apk" | grep -q "assets/index.android.bundle"

          apksigner_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner_path"
          "$apksigner_path" verify --verbose --print-certs "$output_apk"

          sha256sum "$output_apk" > "$output_dir/SHA256SUMS.txt"
          cat "$output_dir/SHA256SUMS.txt"
      - name: Upload field-test APK
        uses: actions/upload-artifact@v4
        with:
          name: personal-exploration-map-field-test
          path: artifacts/field-test/
          if-no-files-found: error
          retention-days: 14

  emulator-e2e:
    name: Android emulator user-flow gate
    needs: field-test-apk
    runs-on: ubuntu-latest
    timeout-minutes: 38
    env:
      APK_PATH: artifacts/field-test/personal-exploration-map-field-test.apk
      EVIDENCE_DIR: artifacts/emulator-e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Download the exact field-test APK produced by this run
        uses: actions/download-artifact@v4
        with:
          name: personal-exploration-map-field-test
          path: artifacts/field-test
      - name: Prepare evidence directory
        run: |
          mkdir -p "$EVIDENCE_DIR"
          cat > "$EVIDENCE_DIR/harness.json" <<'JSON'
          {
            "provider": "ReactiveCircus/android-emulator-runner",
            "version": "2.37.0",
            "apiLevel": 35,
            "target": "google_apis",
            "arch": "x86_64"
          }
          JSON
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run black-box PersonalMap lifecycle on Android 15
        uses: ReactiveCircus/android-emulator-runner@v2.37.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel
          cores: 2
          ram-size: 4096M
          emulator-boot-timeout: 600
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -no-snapshot -noaudio
            -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            python3 scripts/android-emulator-smoke.py \
              --apk "$APK_PATH" \
              --artifacts "$EVIDENCE_DIR"
            python3 scripts/android-emulator-interaction-smoke.py \
              --artifacts "$EVIDENCE_DIR"
      - name: Upload emulator screenshots, UI hierarchy and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: personal-exploration-map-emulator-e2e
          path: artifacts/emulator-e2e/
          if-no-files-found: warn
          retention-days: 14
