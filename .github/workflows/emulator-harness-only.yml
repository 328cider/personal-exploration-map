name: emulator-harness-only

on:
  pull_request:
    paths:
      - ".github/workflows/emulator-harness-only.yml"
      - "scripts/android-emulator-smoke.py"
      - "scripts/android-emulator-coverage-modes.py"
      - "scripts/android-emulator-interaction-smoke.py"
      - "scripts/android-emulator-interaction-runner.py"
      - "scripts/run-android-emulator-e2e.sh"

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: emulator-harness-only-v2-${{ github.ref }}
  cancel-in-progress: true

env:
  APK_PATH: artifacts/field-test/personal-exploration-map-field-test.apk
  EVIDENCE_DIR: artifacts/emulator-e2e

jobs:
  emulator-e2e:
    name: Android emulator harness-only gate
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Confirm this PR changes only the emulator harness
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          changed_files="$(
            gh api --paginate \
              "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
              --jq '.[].filename'
          )"
          printf '%s\n' "$changed_files"

          if grep -Eq '^(apps/mobile/|packages/|package\.json$|package-lock\.json$|\.nvmrc$)' <<<"$changed_files"; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "App or dependency files changed; the full devex-field-test APK run is authoritative."
          else
            echo "eligible=true" >> "$GITHUB_OUTPUT"
            echo "Only harness-side files changed; a compatible signed APK may be reused."
          fi

      - name: Report full-APK handoff
        if: steps.scope.outputs.eligible != 'true'
        run: >-
          echo "Harness-only emulator execution skipped because this PR changes the app or dependency graph."

      - uses: actions/setup-java@v5
        if: steps.scope.outputs.eligible == 'true'
        with:
          distribution: temurin
          java-version: "17"

      - name: Find the newest compatible Field-test APK from this PR branch
        if: steps.scope.outputs.eligible == 'true'
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          selected=""
          while IFS= read -r run_id; do
            artifact_count="$(
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" \
                --jq '[.artifacts[] | select(.name == "personal-exploration-map-field-test" and .expired == false)] | length'
            )"
            if [ "$artifact_count" -gt 0 ]; then
              selected="$run_id"
              break
            fi
          done < <(
            gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/devex-field-test.yml/runs?event=pull_request&branch=$HEAD_BRANCH&status=completed&per_page=30" \
              --jq '.workflow_runs[].id'
          )

          if [ -z "$selected" ]; then
            echo "No non-expired Field-test APK artifact exists for branch $HEAD_BRANCH." >&2
            echo "Run the full devex-field-test workflow after an app/package change." >&2
            exit 1
          fi

          echo "run_id=$selected" >> "$GITHUB_OUTPUT"
          echo "Reusing Field-test APK from workflow run $selected"

      - name: Download the previously built and signed APK
        if: steps.scope.outputs.eligible == 'true'
        uses: actions/download-artifact@v4
        with:
          name: personal-exploration-map-field-test
          path: artifacts/field-test
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Record harness source
        if: steps.scope.outputs.eligible == 'true'
        run: |
          mkdir -p "$EVIDENCE_DIR"
          cat > "$EVIDENCE_DIR/harness.json" <<JSON
          {
            "provider": "ReactiveCircus/android-emulator-runner",
            "version": "2.37.0",
            "apiLevel": 35,
            "target": "google_apis",
            "arch": "x86_64",
            "apkWorkflowRunId": "${{ steps.source.outputs.run_id }}",
            "mode": "harness-only"
          }
          JSON

      - name: Enable KVM group permissions
        if: steps.scope.outputs.eligible == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run lifecycle, coverage, notification and marker checks on Android 15
        if: steps.scope.outputs.eligible == 'true'
        uses: ReactiveCircus/android-emulator-runner@v2.37.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel
          cores: 2
          ram-size: 4096M
          emulator-boot-timeout: 600
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -no-snapshot -noaudio
            -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: bash scripts/run-android-emulator-e2e.sh "$APK_PATH" "$EVIDENCE_DIR"

      - name: Upload emulator screenshots, hierarchy and logs
        if: always() && steps.scope.outputs.eligible == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: personal-exploration-map-emulator-harness-only
          path: artifacts/emulator-e2e/
          if-no-files-found: warn
          retention-days: 14
