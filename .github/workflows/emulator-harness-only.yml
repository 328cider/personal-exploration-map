name: emulator-harness-only

on:
  pull_request:
    paths:
      - ".github/workflows/emulator-harness-only.yml"
      - "scripts/android-emulator-smoke.py"
      - "scripts/android-emulator-smoke-runner.py"
      - "scripts/android-emulator-coverage-modes.py"
      - "scripts/android-emulator-interaction-smoke.py"
      - "scripts/android-emulator-interaction-runner.py"
      - "scripts/run-android-emulator-e2e.sh"

permissions:
  contents: read
  actions: read

concurrency:
  group: emulator-harness-only-v3-${{ github.ref }}
  cancel-in-progress: true

env:
  APK_PATH: artifacts/field-test/personal-exploration-map-field-test.apk
  EVIDENCE_DIR: artifacts/emulator-e2e

jobs:
  emulator-e2e:
    name: Android emulator harness-only gate
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Find a signed APK compatible with the current app tree
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.head_ref }}
          BASE_BRANCH: ${{ github.base_ref }}
          CURRENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          selected_run=""
          selected_sha=""

          candidate_runs() {
            for branch in "$HEAD_BRANCH" "$BASE_BRANCH"; do
              gh api \
                "repos/$GITHUB_REPOSITORY/actions/workflows/devex-field-test.yml/runs?event=pull_request&branch=$branch&status=completed&per_page=30" \
                --jq '.workflow_runs[] | [.id, .head_sha] | @tsv'
            done
          }

          while IFS=$'\t' read -r run_id run_sha; do
            [ -n "$run_id" ] || continue
            artifact_count="$(
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" \
                --jq '[.artifacts[] | select(.name == "personal-exploration-map-field-test" and .expired == false)] | length'
            )"
            [ "$artifact_count" -gt 0 ] || continue

            compare_status="$(
              gh api "repos/$GITHUB_REPOSITORY/compare/$run_sha...$CURRENT_HEAD" \
                --jq '.status' 2>/dev/null || true
            )"
            if [ "$compare_status" != "ahead" ] && [ "$compare_status" != "identical" ]; then
              continue
            fi

            changed_files="$(
              gh api "repos/$GITHUB_REPOSITORY/compare/$run_sha...$CURRENT_HEAD" \
                --jq '.files[]?.filename' 2>/dev/null || true
            )"
            printf 'Candidate APK run %s at %s; changes since build:\n%s\n' \
              "$run_id" "$run_sha" "$changed_files"

            if grep -Eq '^(apps/mobile/|packages/|package\.json$|package-lock\.json$|\.nvmrc$|scripts/prepare-field-test-sources\.mjs$)' <<<"$changed_files"; then
              continue
            fi

            selected_run="$run_id"
            selected_sha="$run_sha"
            break
          done < <(candidate_runs)

          if [ -z "$selected_run" ]; then
            echo "No signed APK matches the current app/package tree." >&2
            echo "The full devex-field-test workflow must produce one first." >&2
            exit 1
          fi

          echo "run_id=$selected_run" >> "$GITHUB_OUTPUT"
          echo "head_sha=$selected_sha" >> "$GITHUB_OUTPUT"
          echo "Reusing signed Field-test APK from run $selected_run at $selected_sha"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Download the compatible signed APK
        uses: actions/download-artifact@v4
        with:
          name: personal-exploration-map-field-test
          path: artifacts/field-test
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Record harness source
        run: |
          mkdir -p "$EVIDENCE_DIR"
          cat > "$EVIDENCE_DIR/harness.json" <<JSON
          {
            "provider": "ReactiveCircus/android-emulator-runner",
            "version": "2.37.0",
            "apiLevel": 35,
            "target": "google_apis",
            "arch": "x86_64",
            "apkWorkflowRunId": "${{ steps.source.outputs.run_id }}",
            "apkHeadSha": "${{ steps.source.outputs.head_sha }}",
            "currentHeadSha": "${{ github.event.pull_request.head.sha }}",
            "mode": "harness-only-compatible-apk"
          }
          JSON

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run lifecycle, coverage, notification and marker checks on Android 15
        uses: ReactiveCircus/android-emulator-runner@v2.37.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel
          cores: 2
          ram-size: 4096M
          emulator-boot-timeout: 600
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -no-snapshot -noaudio
            -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: bash scripts/run-android-emulator-e2e.sh "$APK_PATH" "$EVIDENCE_DIR"

      - name: Upload emulator screenshots, hierarchy and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: personal-exploration-map-emulator-harness-only
          path: artifacts/emulator-e2e/
          if-no-files-found: warn
          retention-days: 14
