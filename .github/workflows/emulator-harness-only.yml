name: emulator-harness-only

on:
  pull_request:
    paths:
      - ".github/workflows/emulator-harness-only.yml"
      - "scripts/android-emulator-smoke.py"
      - "scripts/android-emulator-smoke-runner.py"
      - "scripts/android-emulator-coverage-modes.py"
      - "scripts/android-emulator-interaction-smoke.py"
      - "scripts/android-emulator-interaction-runner.py"
      - "scripts/run-android-emulator-e2e.sh"

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: emulator-harness-only-${{ github.ref }}
  cancel-in-progress: true

env:
  APK_PATH: artifacts/field-test/personal-exploration-map-field-test.apk
  EVIDENCE_DIR: artifacts/emulator-e2e

jobs:
  classify:
    name: Classify emulator-only change
    runs-on: ubuntu-latest
    outputs:
      harness_only: ${{ steps.classify.outputs.harness_only }}
    steps:
      - name: Require every changed file to be harness-only
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          harness_only=true
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/emulator-harness-only.yml|\
              scripts/android-emulator-smoke.py|\
              scripts/android-emulator-smoke-runner.py|\
              scripts/android-emulator-coverage-modes.py|\
              scripts/android-emulator-interaction-smoke.py|\
              scripts/android-emulator-interaction-runner.py|\
              scripts/run-android-emulator-e2e.sh)
                echo "Harness-only: $path"
                ;;
              *)
                harness_only=false
                echo "Exact APK rebuild required by: $path"
                ;;
            esac
          done < <(
            gh api --paginate \
              "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" \
              --jq '.[].filename'
          )
          echo "harness_only=$harness_only" >> "$GITHUB_OUTPUT"

  emulator-e2e:
    name: Android emulator harness-only gate
    needs: classify
    if: >-
      needs.classify.outputs.harness_only == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Find the newest compatible Field-test APK from this PR stack
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.head_ref }}
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          selected=""
          selected_branch=""
          for branch in "$HEAD_BRANCH" "$BASE_BRANCH"; do
            while IFS= read -r run_id; do
              artifact_count="$(
                gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" \
                  --jq '[.artifacts[] | select(.name == "personal-exploration-map-field-test" and .expired == false)] | length'
              )"
              if [ "$artifact_count" -gt 0 ]; then
                selected="$run_id"
                selected_branch="$branch"
                break
              fi
            done < <(
              gh api \
                "repos/$GITHUB_REPOSITORY/actions/workflows/devex-field-test.yml/runs?event=pull_request&branch=$branch&status=completed&per_page=30" \
                --jq '.workflow_runs[].id'
            )
            if [ -n "$selected" ]; then
              break
            fi
          done

          if [ -z "$selected" ]; then
            echo "No non-expired Field-test APK artifact exists for $HEAD_BRANCH or $BASE_BRANCH." >&2
            echo "Run the full devex-field-test workflow after an app/package change." >&2
            exit 1
          fi

          echo "run_id=$selected" >> "$GITHUB_OUTPUT"
          echo "source_branch=$selected_branch" >> "$GITHUB_OUTPUT"
          echo "Reusing Field-test APK from workflow run $selected on $selected_branch"

      - name: Download the previously built and signed APK
        uses: actions/download-artifact@v4
        with:
          name: personal-exploration-map-field-test
          path: artifacts/field-test
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Record harness source
        run: |
          mkdir -p "$EVIDENCE_DIR"
          cat > "$EVIDENCE_DIR/harness.json" <<JSON
          {
            "provider": "ReactiveCircus/android-emulator-runner",
            "version": "2.37.0",
            "apiLevel": 35,
            "target": "google_apis",
            "arch": "x86_64",
            "apkWorkflowRunId": "${{ steps.source.outputs.run_id }}",
            "apkSourceBranch": "${{ steps.source.outputs.source_branch }}",
            "mode": "harness-only"
          }
          JSON

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run lifecycle, coverage, notification and marker checks on Android 15
        uses: ReactiveCircus/android-emulator-runner@v2.37.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel
          cores: 2
          ram-size: 4096M
          emulator-boot-timeout: 600
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -no-snapshot -noaudio
            -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: bash scripts/run-android-emulator-e2e.sh "$APK_PATH" "$EVIDENCE_DIR"

      - name: Upload emulator screenshots, hierarchy and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: personal-exploration-map-emulator-harness-only
          path: artifacts/emulator-e2e/
          if-no-files-found: warn
          retention-days: 14
