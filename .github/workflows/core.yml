name: mapping-core

on:
  pull_request:
    paths:
      - "packages/mapping-core/**"
      - "package.json"
      - ".github/workflows/core.yml"
  push:
    branches: [main]
    paths:
      - "packages/mapping-core/**"
      - "package.json"
      - ".github/workflows/core.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run dependency-free mapping-core tests
        run: npm test
