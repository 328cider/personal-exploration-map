name: mapping-packages

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    paths:
      - "packages/mapping-core/**"
      - "packages/mapping-engine/**"
      - "packages/experience-sdk/**"
      - "packages/sqlite-adapter/**"
      - "apps/mobile/src/storage/database.ts"
      - "apps/mobile/src/storage/sqliteMappingRepository.ts"
      - "package.json"
      - ".github/workflows/core.yml"
  push:
    branches: [main]
    paths:
      - "packages/mapping-core/**"
      - "packages/mapping-engine/**"
      - "packages/experience-sdk/**"
      - "packages/sqlite-adapter/**"
      - "apps/mobile/src/storage/database.ts"
      - "apps/mobile/src/storage/sqliteMappingRepository.ts"
      - "package.json"
      - ".github/workflows/core.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run dependency-free mapping package tests
        run: npm test
      - name: Install pinned TypeScript compiler outside the workspace
        run: >-
          npm install
          --prefix /tmp/personal-map-typescript
          --no-save
          --ignore-scripts
          --no-audit
          --no-fund
          typescript@5.8.3
      - name: Type-check dependency-free mapping packages
        shell: bash
        run: |
          TSC=/tmp/personal-map-typescript/node_modules/.bin/tsc
          "$TSC" --noEmit -p packages/mapping-core/tsconfig.json
          "$TSC" --noEmit -p packages/mapping-engine/tsconfig.json
          "$TSC" --noEmit -p packages/experience-sdk/tsconfig.json
          "$TSC" --noEmit -p packages/sqlite-adapter/tsconfig.json
