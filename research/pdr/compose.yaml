services:
  pdr-audit:
    build:
      context: ../..
      dockerfile: research/pdr/docker/Dockerfile
    working_dir: /workspace
    volumes:
      - ../..:/workspace
      - ./data:/data:ro
      - ./outputs:/outputs
    network_mode: none

  pdr-fetch:
    build:
      context: ../..
      dockerfile: research/pdr/docker/Dockerfile
    working_dir: /workspace
    volumes:
      - ../..:/workspace:ro
      - ./data:/data
      - ./outputs:/outputs
